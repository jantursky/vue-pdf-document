# Coverage comes from the library's unit tests; the demo and docs aren't measured.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 90%
comment:
  layout: 'condensed_header, diff, files'
  require_changes: true
ignore:
  - apps/**
  - packages/vue-pdf-document/test/**
